<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Lucky Stars — Panel Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0B0B18; --bg2: #101026; --card: #15152F; --card2: #1B1B3B;
  --line: rgba(255,255,255,.07); --line2: rgba(124,58,237,.38);
  --text: #F1F0FF; --muted: #8B85A0; --faint: #5E5A75;
  --purple: #7C3AED; --purple2: #A855F7; --gold: #FFD700; --gold2: #FFA500;
  --green: #22c55e; --red: #ef4444; --blue: #38bdf8; --pink: #EC4899; --amber: #f59e0b;
  --radius: 16px; --side: 232px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { color-scheme: dark; }
body { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body::before { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(ellipse at 15% 0%, rgba(124,58,237,.16), transparent 50%), radial-gradient(ellipse at 90% 100%, rgba(236,72,153,.09), transparent 50%); }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--purple2); outline-offset: 2px; }
.hidden { display: none !important; }
.muted { color: var(--muted); } .gold { color: var(--gold); } .green { color: var(--green); } .red { color: var(--red); }
.mono { font-variant-numeric: tabular-nums; }

/* ── Login ── */
#login { position: relative; z-index: 1; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.login-card { width: 100%; max-width: 380px; background: linear-gradient(160deg, var(--card2), var(--card)); border: 1px solid var(--line2); border-radius: 24px; padding: 36px 30px; text-align: center; box-shadow: 0 24px 80px rgba(124,58,237,.18); }
.login-logo { font-size: 44px; margin-bottom: 6px; filter: drop-shadow(0 0 18px rgba(255,215,0,.45)); }
.login-title { font-size: 24px; font-weight: 800; background: linear-gradient(90deg, var(--gold), var(--gold2)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.login-sub { color: var(--muted); font-size: 13px; margin: 4px 0 26px; }
.pass-wrap { position: relative; margin-bottom: 12px; }
.pass-wrap .input { padding-right: 46px; text-align: center; letter-spacing: 2px; }
.pass-eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: 0; width: 38px; height: 38px; border-radius: 10px; font-size: 16px; opacity: .7; }
.pass-eye:hover { opacity: 1; background: rgba(255,255,255,.05); }
.login-err { color: var(--red); font-size: 13px; min-height: 20px; margin-bottom: 8px; }

/* ── Shell ── */
#app { position: relative; z-index: 1; display: flex; min-height: 100vh; }
.side { width: var(--side); flex-shrink: 0; background: rgba(16,16,38,.85); backdrop-filter: blur(12px); border-right: 1px solid var(--line); padding: 20px 14px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 22px; }
.brand-ico { font-size: 26px; filter: drop-shadow(0 0 10px rgba(255,215,0,.5)); }
.brand-name { font-weight: 800; font-size: 17px; line-height: 1.1; }
.brand-tag { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: var(--purple2); }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav button { display: flex; align-items: center; gap: 12px; width: 100%; background: none; border: 1px solid transparent; border-radius: 12px; padding: 11px 12px; color: var(--muted); font-weight: 600; text-align: left; transition: .15s; position: relative; }
.nav button:hover { background: rgba(255,255,255,.04); color: var(--text); }
.nav button.active { background: linear-gradient(90deg, rgba(124,58,237,.28), rgba(124,58,237,.08)); border-color: var(--line2); color: #fff; }
.nav .ico { font-size: 17px; width: 22px; text-align: center; }
.nav .badge { margin-left: auto; background: var(--amber); color: #1a1200; font-size: 11px; font-weight: 800; border-radius: 99px; padding: 1px 7px; }
.side-foot { margin-top: auto; padding: 10px 8px 0; font-size: 12px; color: var(--faint); }
.main { flex: 1; min-width: 0; padding: 0 28px 40px; }
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 16px 0; background: linear-gradient(var(--bg) 70%, transparent); }
.topbar h1 { font-size: 22px; font-weight: 800; letter-spacing: -.3px; }
.topbar .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
.topbar .sp { flex: 1; }
.live-dot { display: inline-block; width: 7px; height: 7px; background: var(--green); border-radius: 50%; margin-right: 6px; box-shadow: 0 0 0 0 rgba(34,197,94,.6); animation: pulse 2s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 7px rgba(34,197,94,0); } 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); } }

/* ── Controles ── */
.input, select.input, textarea.input { width: 100%; background: rgba(0,0,0,.32); border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; outline: none; transition: .15s; min-height: 42px; }
.input:focus { border-color: var(--purple2); box-shadow: 0 0 0 3px rgba(168,85,247,.18); }
.input::placeholder { color: var(--faint); }
textarea.input { resize: vertical; min-height: 78px; }
select.input option { background: #15152F; }
label.lbl { display: block; font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .6px; text-transform: uppercase; margin-bottom: 6px; }
.hint { font-size: 12px; color: var(--faint); margin-top: 5px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: rgba(255,255,255,.05); border-radius: 12px; padding: 0 16px; min-height: 42px; font-weight: 700; transition: .15s; white-space: nowrap; }
.btn:hover { background: rgba(255,255,255,.09); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: linear-gradient(135deg, var(--purple), var(--purple2)); border-color: transparent; color: #fff; box-shadow: 0 6px 22px rgba(124,58,237,.35); }
.btn.primary:hover { filter: brightness(1.1); }
.btn.gold { background: linear-gradient(135deg, var(--gold), var(--gold2)); border-color: transparent; color: #241a00; }
.btn.success { background: rgba(34,197,94,.14); border-color: rgba(34,197,94,.4); color: #6ee7a0; }
.btn.danger { background: rgba(239,68,68,.12); border-color: rgba(239,68,68,.4); color: #fca5a5; }
.btn.danger:hover { background: rgba(239,68,68,.22); }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
.btn.block { width: 100%; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.fld { margin-bottom: 14px; }

/* ── Tarjetas ── */
.card { background: linear-gradient(160deg, rgba(27,27,59,.85), rgba(21,21,47,.92)); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-bottom: 18px; }
.card-h { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.card-h h2 { font-size: 15px; font-weight: 800; }
.card-h .sp { flex: 1; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 18px; }
.kpi { position: relative; overflow: hidden; border-radius: var(--radius); padding: 18px; background: var(--card); border: 1px solid var(--line); }
.kpi::after { content: ''; position: absolute; right: -24px; top: -24px; width: 90px; height: 90px; border-radius: 50%; background: var(--c, var(--purple)); opacity: .14; }
.kpi .k-l { font-size: 11px; font-weight: 700; letter-spacing: .7px; text-transform: uppercase; color: var(--muted); }
.kpi .k-v { font-size: 30px; font-weight: 800; letter-spacing: -1px; margin: 6px 0 2px; color: var(--c, var(--text)); }
.kpi .k-s { font-size: 12px; color: var(--muted); }
.up { color: var(--green); } .down { color: var(--red); }
.alert { display: flex; gap: 12px; align-items: flex-start; border-radius: 14px; padding: 13px 15px; margin-bottom: 14px; border: 1px solid; font-size: 13px; }
.alert .a-i { font-size: 18px; line-height: 1.2; }
.alert.warn { background: rgba(245,158,11,.1); border-color: rgba(245,158,11,.35); color: #fcd34d; }
.alert.info { background: rgba(56,189,248,.09); border-color: rgba(56,189,248,.3); color: #7dd3fc; }
.alert.bad { background: rgba(239,68,68,.1); border-color: rgba(239,68,68,.35); color: #fca5a5; }
.alert.good { background: rgba(34,197,94,.1); border-color: rgba(34,197,94,.3); color: #86efac; }
.alert a, .alert button.lnk { color: inherit; font-weight: 800; text-decoration: underline; background: none; border: 0; padding: 0; }

.bar { height: 12px; background: rgba(0,0,0,.4); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--purple), var(--pink), var(--gold)); transition: width .6s; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { background: rgba(0,0,0,.3); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; min-width: 112px; text-align: center; }
.chip .c-e { font-size: 20px; } .chip .c-m { font-weight: 800; font-size: 16px; } .chip .c-d { font-size: 11px; color: var(--muted); }
.tag { display: inline-block; padding: 3px 9px; border-radius: 99px; font-size: 11px; font-weight: 700; border: 1px solid; white-space: nowrap; }
.t-ad { color: #86efac; background: rgba(34,197,94,.1); border-color: rgba(34,197,94,.3); }
.t-canal { color: #7dd3fc; background: rgba(56,189,248,.1); border-color: rgba(56,189,248,.3); }
.t-referido { color: #f9a8d4; background: rgba(236,72,153,.1); border-color: rgba(236,72,153,.3); }
.t-bonus { color: #fde047; background: rgba(255,215,0,.1); border-color: rgba(255,215,0,.3); }
.t-regalo { color: #d8b4fe; background: rgba(168,85,247,.12); border-color: rgba(168,85,247,.35); }
.t-compra, .t-otro { color: #cbd5e1; background: rgba(148,163,184,.1); border-color: rgba(148,163,184,.3); }
.t-ok { color: #86efac; background: rgba(34,197,94,.1); border-color: rgba(34,197,94,.3); }
.t-pend { color: #fcd34d; background: rgba(245,158,11,.1); border-color: rgba(245,158,11,.35); }
.t-ban { color: #fca5a5; background: rgba(239,68,68,.1); border-color: rgba(239,68,68,.35); }

/* ── Gráficas ── */
.charts { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.chart { width: 100%; height: auto; display: block; }
.chart .cv { fill: var(--text); font-size: 11px; font-weight: 700; text-anchor: middle; }
.chart .cl { fill: var(--faint); font-size: 10px; text-anchor: middle; }
.hbar { display: grid; grid-template-columns: 112px 1fr 64px; gap: 10px; align-items: center; margin-bottom: 11px; font-size: 13px; }
.hbar .h-t { height: 10px; background: rgba(0,0,0,.4); border-radius: 99px; overflow: hidden; }
.hbar .h-t i { display: block; height: 100%; border-radius: 99px; }
.hbar .h-n { text-align: right; font-weight: 700; }

/* ── Tablas ── */
.tbl-wrap { overflow-x: auto; border-radius: 12px; }
table { width: 100%; border-collapse: collapse; min-width: 560px; }
th { text-align: left; font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:hover { background: rgba(255,255,255,.025); }
td .u-n { font-weight: 700; } td .u-s { font-size: 12px; color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 34px 10px; }
.pager { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 14px; color: var(--muted); font-size: 13px; }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
.toolbar .input { flex: 1; min-width: 180px; }
.toolbar select.input { flex: 0 0 auto; width: auto; min-width: 160px; }
.chk { display: flex; align-items: center; gap: 8px; color: var(--muted); font-weight: 600; cursor: pointer; }
.chk input { width: 17px; height: 17px; accent-color: var(--purple2); }

/* ── Premios editor ── */
.prem-row { display: grid; grid-template-columns: 36px 1fr 150px 40px; gap: 10px; align-items: center; margin-bottom: 10px; }
.prem-row .medal { font-size: 24px; text-align: center; }
.money-in { position: relative; } .money-in span { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 700; } .money-in .input { padding-left: 28px; }
.estim { border-radius: 14px; padding: 14px 16px; background: rgba(0,0,0,.25); border: 1px dashed var(--line2); margin: 6px 0 18px; font-size: 13px; }
.estim .e-r { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
.estim .e-r b { font-variant-numeric: tabular-nums; }
.winner-h { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.winner-h h3 { font-size: 15px; }

/* ── Modal / Toast ── */
.modal-bg { position: fixed; inset: 0; background: rgba(5,5,14,.72); backdrop-filter: blur(4px); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 18px; animation: fade .15s; }
.modal { width: 100%; max-width: 440px; background: var(--card2); border: 1px solid var(--line2); border-radius: 20px; padding: 24px; box-shadow: 0 30px 80px rgba(0,0,0,.6); max-height: 90vh; overflow-y: auto; }
.modal h3 { font-size: 18px; margin-bottom: 8px; } .modal p { color: var(--muted); margin-bottom: 18px; }
.modal .acts { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
@keyframes fade { from { opacity: 0; } }
#toasts { position: fixed; right: 18px; bottom: 18px; z-index: 200; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
.toast { background: var(--card2); border: 1px solid var(--line2); border-left-width: 4px; border-radius: 12px; padding: 12px 16px; max-width: 360px; box-shadow: 0 10px 40px rgba(0,0,0,.5); animation: slide .25s; font-weight: 600; }
.toast.ok { border-left-color: var(--green); } .toast.err { border-left-color: var(--red); }
@keyframes slide { from { transform: translateY(14px); opacity: 0; } }
.spin { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.2); border-top-color: var(--purple2); border-radius: 50%; animation: rot .7s linear infinite; display: inline-block; }
@keyframes rot { to { transform: rotate(360deg); } }
.loading { display: flex; align-items: center; gap: 12px; justify-content: center; color: var(--muted); padding: 60px 0; }

/* ── Responsive ── */
@media (max-width: 920px) {
  #app { flex-direction: column; }
  .side { position: fixed; z-index: 50; bottom: 0; left: 0; right: 0; top: auto; width: 100%; height: auto; flex-direction: row; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); border-right: 0; border-top: 1px solid var(--line); background: rgba(13,13,32,.96); }
  .brand, .side-foot { display: none; }
  .nav { flex-direction: row; width: 100%; justify-content: space-around; gap: 2px; }
  .nav button { flex-direction: column; gap: 2px; padding: 7px 4px; font-size: 10px; text-align: center; justify-content: center; flex: 1; min-width: 0; }
  .nav .badge { position: absolute; top: 2px; right: 14%; margin: 0; font-size: 9px; padding: 0 5px; }
  .main { padding: 0 16px 100px; }
  .charts, .grid2 { grid-template-columns: 1fr; }
  .grid3 { grid-template-columns: 1fr; }
  .topbar h1 { font-size: 19px; }
  .prem-row { grid-template-columns: 28px 1fr 112px 36px; gap: 8px; }
  #toasts { right: 12px; left: 12px; bottom: 84px; align-items: stretch; }
}
@media (max-width: 920px) { .kpis { grid-template-columns: 1fr 1fr; gap: 10px; } .kpi { padding: 14px; } .kpi .k-v { font-size: 24px; } }
@media (max-width: 920px) { .hide-m { display: none; } #logout-m { display: inline-flex !important; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <form class="login-card" onsubmit="login(event)">
    <div class="login-logo">⭐</div>
    <div class="login-title">Lucky Stars</div>
    <div class="login-sub">Panel de administración</div>
    <div class="pass-wrap">
      <input class="input" id="pass" type="password" placeholder="Contraseña" autocomplete="current-password" autofocus>
      <button type="button" class="pass-eye" onclick="verPass()" aria-label="Mostrar contraseña">👁</button>
    </div>
    <div class="login-err" id="login-err" role="alert"></div>
    <button class="btn primary block" id="login-btn" type="submit">Entrar</button>
  </form>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <aside class="side">
    <div class="brand"><span class="brand-ico">⭐</span><div><div class="brand-name">Lucky Stars</div><div class="brand-tag">ADMIN</div></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><button class="btn sm block danger" onclick="logout()">Cerrar sesión</button></div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div><h1 id="t-title">Resumen</h1><div class="sub" id="t-sub"></div></div>
      <div class="sp"></div>
      <span class="muted" style="font-size:12px" id="last-update"><span class="live-dot"></span>Conectando…</span>
      <button class="btn sm" onclick="refrescar()" title="Actualizar">↻ <span class="hide-m">Actualizar</span></button>
      <button class="btn sm danger" onclick="logout()" style="display:none" id="logout-m">Salir</button>
    </header>
    <main id="view"></main>
  </div>
</div>

<div id="modal-root"></div>
<div id="toasts" aria-live="polite"></div>

<script>
const BACKEND = 'https://luckystars-backend.onrender.com';
const S = { pass: '', stats: null, view: 'resumen', draft: null, timer: null,
  boletos: { q: '', origen: '', page: 1 }, usuarios: { q: '', orden: 'recientes', baneados: false, page: 1 } };

const VISTAS = {
  resumen:  { ico: '📊', nombre: 'Resumen',  sub: 'Estado general de Lucky Stars' },
  sorteo:   { ico: '🎯', nombre: 'Sorteo',   sub: 'Crea, edita y realiza sorteos' },
  boletos:  { ico: '🎟', nombre: 'Boletos',  sub: 'Participantes del sorteo activo' },
  usuarios: { ico: '👥', nombre: 'Usuarios', sub: 'Quién usa el bot y cuánto participa' },
  ganadores:{ ico: '🏆', nombre: 'Ganadores',sub: 'Historial de sorteos y pago de premios' },
  ajustes:  { ico: '⚙️', nombre: 'Ajustes',  sub: 'Anuncios, límites y mensajes del bot' }
};
const ORIGEN = {
  ad: ['📺 Anuncio', '#22c55e'], canal: ['📣 Canal', '#38bdf8'], referido: ['👥 Referido', '#EC4899'],
  bonus: ['🌟 Bonus', '#FFD700'], regalo: ['🎁 Regalo', '#A855F7'], compra: ['⭐ Comprado', '#94a3b8'], otro: ['Otro', '#64748b']
};
const MEDALLAS = ['🥇', '🥈', '🥉'];
const medalla = i => MEDALLAS[i] || '🏅';

/* ── utilidades ── */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = n => Number(n || 0).toLocaleString('es-MX');
const usd = n => '$' + (Number(n) || 0).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const usdCorto = n => '$' + (Number.isInteger(+n) ? num(n) : (+n).toFixed(2));
const fechaCorta = iso => iso ? new Date(iso).toLocaleString('es-MX', { dateStyle: 'short', timeStyle: 'short' }) : '—';
const fechaLarga = iso => iso ? new Date(iso).toLocaleString('es-MX', { dateStyle: 'long', timeStyle: 'short' }) : '—';
const ss = { get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }, del(k) { try { sessionStorage.removeItem(k); } catch (e) {} } };

function toast(msg, tipo = 'ok') {
  const el = document.createElement('div');
  el.className = 'toast ' + tipo; el.textContent = msg; $('toasts').appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

async function api(path, opts = {}) {
  const res = await fetch(BACKEND + path, {
    method: opts.method || 'GET',
    headers: { 'Content-Type': 'application/json', 'x-admin-password': S.pass },
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if (res.status === 401) { logout(true); throw new Error('Sesión no válida'); }
  if (res.status === 429) throw new Error('Demasiados intentos. Espera unos minutos.');
  let data; try { data = await res.json(); } catch (e) { throw new Error('Respuesta inválida del servidor'); }
  if (data && data.error) throw new Error(data.error);
  return data;
}

function modal({ titulo, html, botones }) {
  return new Promise(resolve => {
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><h3>${titulo}</h3><div>${html}</div><div class="acts"></div></div>`;
    const cerrar = v => { bg.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
    const onKey = e => { if (e.key === 'Escape') cerrar(null); };
    botones.forEach(b => {
      const el = document.createElement('button');
      el.className = 'btn ' + (b.clase || ''); el.textContent = b.texto;
      el.onclick = () => cerrar(b.valor !== undefined ? b.valor : b.texto);
      bg.querySelector('.acts').appendChild(el);
    });
    bg.addEventListener('mousedown', e => { if (e.target === bg) cerrar(null); });
    document.addEventListener('keydown', onKey);
    $('modal-root').appendChild(bg);
    const first = bg.querySelector('input, textarea, .btn:last-child'); if (first) first.focus();
    bg._leer = () => Object.fromEntries([...bg.querySelectorAll('[data-f]')].map(i => [i.dataset.f, i.type === 'checkbox' ? i.checked : i.value]));
    bg.querySelectorAll('.btn').forEach(el => { const prev = el.onclick; el.onclick = () => { const datos = bg._leer(); S._modalDatos = datos; prev(); }; });
  });
}
async function confirmar(titulo, texto, ok = 'Confirmar', peligro = true) {

}
async function accion(btn, fn) {

function verPass() { const i = $('pass'); i.type = i.type === 'password' ? 'text' : 'password'; }

async function login(ev) {
  if (ev) ev.preventDefault();
  const pwd = $('pass').value; if (!pwd) return;
  const btn = $('login-btn'); btn.disabled = true; $('login-err').textContent = '';
  btn.innerHTML = '<span class="spin"></span> Conectando…';
  const lento = setTimeout(() => { btn.innerHTML = '<span class="spin"></span> Despertando el servidor (hasta 1 min)…'; }, 4000);
  try {
    const res = await fetch(BACKEND + '/admin/stats', { headers: { 'x-admin-password': pwd } });
    if (res.status === 401) throw new Error('Contraseña incorrecta');
    if (res.status === 429) throw new Error('Demasiados intentos. Espera unos minutos.');
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    S.pass = pwd; S.stats = data; ss.set('ls_admin', pwd);
    entrar();
  } catch (e) {
    $('login-err').textContent = e.message === 'Failed to fetch' ? 'No se pudo conectar con el servidor' : e.message;
    S.pass = '';
  } finally { clearTimeout(lento); btn.disabled = false; btn.textContent = 'Entrar'; }
}

function entrar() {
  $('login').classList.add('hidden'); $('app').classList.remove('hidden'); $('pass').value = '';
  const h = (location.hash || '').slice(1); S.view = VISTAS[h] ? h : 'resumen';

/* ── gráficas ── */
function corto(d) { const p = d.split('-'); return p[2] + '/' + p[1]; }
function barChart(datos, color) {
  const W = 620, H = 170, t = 22, b = 24, l = 6, r = 6;
  const max = Math.max(1, ...datos.map(d => d.v));
  const bw = (W - l - r) / datos.length;
  let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  svg += `<line x1="${l}" x2="${W - r}" y1="${H - b}" y2="${H - b}" stroke="rgba(255,255,255,.1)"/>`;
  datos.forEach((d, i) => {
    const h = d.v ? Math.max(3, Math.round((d.v / max) * (H - t - b))) : 0;
    const x = l + i * bw + bw * .16, w = bw * .68, y = H - b - h;
    if (h) svg += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5" fill="${color}"><title>${esc(d.dia)}: ${num(d.v)}</title></rect>`;
    if (d.v) svg += `<text class="cv" x="${x + w / 2}" y="${y - 5}">${num(d.v)}</text>`;
    svg += `<text class="cl" x="${x + w / 2}" y="${H - 8}">${corto(d.dia)}</text>`;
  });
  return svg + '</svg>';
}
function hbars(porOrigen) {
  const total = Object.values(porOrigen).reduce((a, b) => a + b, 0);
  if (!total) return '<div class="empty">Aún no hay boletos</div>';
  return Object.entries(ORIGEN).filter(([k]) => porOrigen[k]).map(([k, [nombre, color]]) => {
    const n = porOrigen[k], pct = Math.round((n / total) * 100);
    return `<div class="hbar"><span>${nombre}</span><div class="h-t"><i style="width:${pct}%;background:${color}"></i></div><span class="h-n">${num(n)} <span class="muted" style="font-weight:500">${pct}%</span></span></div>`;
  }).join('');
}
function cuentaAtras(iso) {
  const ms = new Date(iso) - new Date(); if (ms <= 0) return 'en breve';
  const m = Math.floor(ms / 60000), d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60);
  return d ? `en ${d} d ${h} h` : h ? `en ${h} h ${m % 60} min` : `en ${m} min`;
}
function equilibrio(premiosUsd, cpm) { return cpm > 0 ? Math.ceil(premiosUsd / (cpm / 1000)) : null; }

    ${d.items.length ? d.items.map(t => `<tr>
      <td class="mono"><b class="gold">#${esc(t.numero)}</b></td>
      <td><div class="u-n">${t.username ? '@' + esc(t.username) : 'Sin usuario'}</div><div class="u-s">ID ${esc(t.userId)}</div></td>
      <td><span class="tag t-${esc(t.origen)}">${(ORIGEN[t.origen] || ORIGEN.otro)[0]}</span></td>
      <td class="muted">${t.ts ? fechaCorta(t.ts) : esc(t.fecha || '—')}</td>
      <td style="text-align:right"><button class="btn sm danger" title="Eliminar boleto" aria-label="Eliminar boleto ${esc(t.numero)}" onclick="eliminarBoleto('${esc(t.numero)}')">🗑</button></td></tr>`).join('')
      : `<tr><td colspan="5" class="empty">${hayFiltros ? 'Sin resultados para ese filtro' : 'Todavía no hay boletos'}</td></tr>`}
    </tbody></table></div>
    <div class="pager"><button class="btn sm" ${d.page <= 1 ? 'disabled' : ''} onclick="S.boletos.page=${d.page - 1};renderBoletos()">← Anterior</button><span>Página ${d.page} de ${d.pages} · ${num(d.total)} boletos</span><button class="btn sm" ${d.page >= d.pages ? 'disabled' : ''} onclick="S.boletos.page=${d.page + 1};renderBoletos()">Siguiente →</button></div>`;
  if (base) { $('bol-tabla').innerHTML = tabla; return; }
  $('view').innerHTML = `<div id="bol-wrap">
    <div class="card"><div class="card-h"><h2>🎁 Regalar boletos</h2></div>
      <div class="row" style="flex-wrap:nowrap"><input class="input" id="g-user" placeholder="@usuario o ID de Telegram"><input class="input" id="g-cant" type="number" min="1" max="50" value="1" style="max-width:100px" aria-label="Cantidad"><button class="btn primary" onclick="regalar(this)">Regalar</button></div>
      <div class="hint">El usuario debe haber usado el bot al menos una vez. Recibirá un aviso por Telegram.</div></div>
    <div class="card"><div class="card-h"><h2>🎟 Boletos del sorteo activo</h2></div>
      <div class="toolbar"><input class="input" id="b-q" placeholder="Buscar por @usuario, ID o número…" value="${esc(b.q)}" oninput="S.boletos.q=this.value;S.boletos.page=1;buscarDebounce(renderBoletos)">
        <select class="input" id="b-o" onchange="S.boletos.origen=this.value;S.boletos.page=1;renderBoletos()"><option value="">Todos los orígenes</option>${Object.entries(ORIGEN).map(([k, v]) => `<option value="${k}" ${b.origen === k ? 'selected' : ''}>${v[0]}</option>`).join('')}</select>
        <button class="btn" onclick="exportarCSV(this)">⬇ Exportar CSV</button></div>
      <div id="bol-tabla"></div></div></div>`;
  $('bol-tabla').innerHTML = tabla;
}
async function eliminarBoleto(n) {
  if (!await confirmar('Eliminar boleto #' + n, 'El boleto saldrá del sorteo. Úsalo solo para casos de fraude o error.', 'Eliminar')) return;
  await accion(null, async () => { await api('/admin/boleto-eliminar', { method: 'POST', body: { numero: n } }); toast('Boleto eliminado'); await renderBoletos(); });
}
async function regalar(btn) {
  await accion(btn, async () => {
    const r = await api('/admin/dar-boletos', { method: 'POST', body: { usuario: $('g-user').value, cantidad: $('g-cant').value } });
    toast(`🎁 ${r.entregados} boleto(s) regalados a ${r.usuario}`); $('g-user').value = ''; await renderBoletos();
  });
}
async function exportarCSV(btn) {
  await accion(btn, async () => {
    const d = await api('/admin/boletos?all=1&origen=' + encodeURIComponent(S.boletos.origen) + '&q=' + encodeURIComponent(S.boletos.q));
    const celda = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const filas = [['numero', 'user_id', 'username', 'origen', 'fecha'].join(',')].concat(d.items.reverse().map(t => [t.numero, t.userId, t.username, t.origen, t.ts || t.fecha].map(celda).join(',')));
    const blob = new Blob(['﻿' + filas.join('\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `boletos-${new Date().toISOString().slice(0, 10)}.csv`; a.click(); URL.revokeObjectURL(a.href);
    toast(`Exportados ${d.items.length} boletos`);
  });
}

/* ── USUARIOS ── */
async function renderUsuarios() {
  const u = S.usuarios;
  const qs = new URLSearchParams({ q: u.q, orden: u.orden, page: u.page, baneados: u.baneados ? '1' : '0' });
  const d = await api('/admin/usuarios?' + qs);
  const tabla = `<div class="tbl-wrap"><table style="min-width:760px"><thead><tr><th>Usuario</th><th>Boletos</th><th>Anuncios</th><th>Invitados</th><th>Registro</th><th>Wallet</th><th></th></tr></thead><tbody>
    ${d.items.length ? d.items.map(x => `<tr>
      <td><div class="u-n">${x.username ? '@' + esc(x.username) : esc(x.firstName || 'Sin nombre')} ${x.baneado ? '<span class="tag t-ban">Suspendido</span>' : ''}</div><div class="u-s">ID ${esc(x.userId)}${x.referidoPor ? ' · invitado por ' + esc(x.referidoPor) : ''}</div></td>
      <td class="mono"><b>${num(x.boletos)}</b></td><td class="mono">${num(x.adsTotal)}</td><td class="mono">${num(x.referidos)}</td>
      <td class="muted">${fechaCorta(x.fechaRegistro)}</td>
      <td>${x.wallet ? `<button class="btn sm" data-v="${esc(x.wallet)}" onclick="copiar(this.dataset.v)" title="${esc(x.wallet)}">📋 Copiar</button>` : '<span class="muted">—</span>'}</td>
      <td style="text-align:right"><button class="btn sm ${x.baneado ? 'success' : 'danger'}" onclick="banear('${esc(x.userId)}',${!x.baneado})">${x.baneado ? 'Reactivar' : 'Suspender'}</button></td></tr>`).join('')
      : '<tr><td colspan="7" class="empty">No hay usuarios con ese filtro</td></tr>'}
    </tbody></table></div>
    <div class="pager"><button class="btn sm" ${d.page <= 1 ? 'disabled' : ''} onclick="S.usuarios.page=${d.page - 1};renderUsuarios()">← Anterior</button><span>Página ${d.page} de ${d.pages} · ${num(d.total)} usuarios</span><button class="btn sm" ${d.page >= d.pages ? 'disabled' : ''} onclick="S.usuarios.page=${d.page + 1};renderUsuarios()">Siguiente →</button></div>`;
  if ($('usr-tabla')) { $('usr-tabla').innerHTML = tabla; return; }
  $('view').innerHTML = `<div class="card"><div class="card-h"><h2>👥 Usuarios del bot</h2></div>
    <div class="toolbar"><input class="input" placeholder="Buscar por @usuario, nombre o ID…" value="${esc(u.q)}" oninput="S.usuarios.q=this.value;S.usuarios.page=1;buscarDebounce(renderUsuarios)">
      <select class="input" onchange="S.usuarios.orden=this.value;S.usuarios.page=1;renderUsuarios()">
        <option value="recientes" ${u.orden === 'recientes' ? 'selected' : ''}>Más recientes</option><option value="boletos" ${u.orden === 'boletos' ? 'selected' : ''}>Más boletos (sorteo activo)</option><option value="anuncios" ${u.orden === 'anuncios' ? 'selected' : ''}>Más anuncios vistos</option></select>
      <label class="chk"><input type="checkbox" ${u.baneados ? 'checked' : ''} onchange="S.usuarios.baneados=this.checked;S.usuarios.page=1;renderUsuarios()"> Solo suspendidos</label></div>
    <div id="usr-tabla"></div></div>`;
  $('usr-tabla').innerHTML = tabla;
}
async function banear(id, ban) {
  const ok = await confirmar(ban ? 'Suspender usuario' : 'Reactivar usuario', ban ? 'No podrá ganar más boletos y <b>se eliminarán sus boletos del sorteo activo</b>.' : 'Podrá volver a participar.', ban ? 'Suspender' : 'Reactivar', ban);
  if (!ok) return;
  await accion(null, async () => { const r = await api('/admin/banear', { method: 'POST', body: { userId: id, ban } }); toast(ban ? `Suspendido (${r.boletosRetirados} boletos retirados)` : 'Usuario reactivado'); await renderUsuarios(); });
}
function copiar(t) { (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('Copiado'), () => toast('No se pudo copiar', 'err')); }

/* ── GANADORES ── */
async function renderGanadores() {
  const hist = await api('/admin/historial');
  S._hist = hist;
  if (!hist.length) { $('view').innerHTML = '<div class="card"><div class="empty">Aún no se ha realizado ningún sorteo.</div></div>'; return; }
  $('view').innerHTML = hist.map(h => {
    const pend = h.ganadores.filter(g => !g.pagado).length;
    return `<div class="card">
      <div class="winner-h"><h3>${h.cancelado ? '🚫' : '🏆'} ${esc(h.titulo)}</h3>
        <span class="muted">${fechaLarga(h.fecha)}</span>
        ${h.cancelado ? '<span class="tag t-ban">Cancelado</span>' : `<span class="muted">${num(h.totalBoletos)} boletos · ${num(h.participantes)} participantes</span>${pend ? `<span class="tag t-pend">${pend} por pagar</span>` : '<span class="tag t-ok">Todo pagado</span>'}`}</div>
      ${h.cancelado ? '' : h.ganadores.length ? `<div class="tbl-wrap"><table style="min-width:720px"><thead><tr><th>Premio</th><th>Ganador</th><th>Boleto</th><th>Wallet</th><th>Estado</th><th></th></tr></thead><tbody>
        ${h.ganadores.map(g => `<tr>
          <td><span style="font-size:18px">${medalla(g.premio.lugar - 1)}</span> <b class="gold">${usd(g.premio.montoUsd)}</b><div class="u-s">${esc(g.premio.descripcion)}</div></td>
          <td>${g.username ? `<a class="u-n" style="color:var(--blue);text-decoration:none" href="https://t.me/${esc(g.username)}" target="_blank" rel="noopener">@${esc(g.username)}</a>` : `<span class="u-n">${esc(g.nombre || 'Sin usuario')}</span>`}<div class="u-s">ID ${esc(g.userId)}</div></td>
          <td class="mono">#${esc(g.numero)}</td>
          <td>${g.wallet ? `<div style="max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(g.wallet)}">${esc(g.wallet)}</div><button class="btn sm" style="margin-top:4px" data-v="${esc(g.wallet)}" onclick="copiar(this.dataset.v)">📋 Copiar</button>` : '<span class="tag t-pend">⚠ Sin wallet</span><div class="u-s">Aún no usa /wallet</div>'}</td>
          <td>${g.pagado ? `<span class="tag t-ok">Pagado</span><div class="u-s">${fechaCorta(g.pagadoEn)}${g.txid ? '<br>Ref: ' + esc(g.txid) : ''}</div>` : '<span class="tag t-pend">Pendiente</span>'}</td>
          <td style="text-align:right"><button class="btn sm ${g.pagado ? '' : 'success'}" onclick="pagoModal('${esc(h.id)}','${esc(g.userId)}',${g.pagado ? 'true' : 'false'})">${g.pagado ? 'Editar' : '💸 Marcar pagado'}</button></td></tr>`).join('')}
        </tbody></table></div>` : '<div class="empty">Este sorteo no tuvo participantes.</div>'}
    </div>`;
  }).join('');
}
async function pagoModal(hid, uid, yaPagado) {
  const g = S._hist.find(h => h.id === hid).ganadores.find(x => x.userId === uid);
  const r = await modal({
    titulo: yaPagado ? 'Editar pago' : '💸 Registrar pago',
    html: `<p>${medalla(g.premio.lugar - 1)} <b class="gold">${usd(g.premio.montoUsd)}</b> para ${g.username ? '@' + esc(g.username) : 'ID ' + esc(g.userId)}${g.wallet ? `<br><span class="u-s">Wallet: ${esc(g.wallet)}</span>` : ''}</p>
      <div class="fld"><label class="lbl">Referencia / TXID</label><input class="input" data-f="txid" maxlength="200" value="${esc(g.txid || '')}" placeholder="Hash de la transacción"></div>
      <div class="fld"><label class="lbl">Nota interna</label><input class="input" data-f="nota" maxlength="300" value="${esc(g.nota || '')}" placeholder="Opcional"></div>
      <label class="chk"><input type="checkbox" data-f="notificar" ${yaPagado ? '' : 'checked'}> Avisar al ganador por Telegram</label>`,
    botones: [{ texto: 'Cancelar', valor: null }].concat(yaPagado ? [{ texto: 'Marcar pendiente', clase: 'danger', valor: 'pend' }] : []).concat([{ texto: yaPagado ? 'Guardar' : 'Marcar pagado', clase: 'primary', valor: 'pagar' }])
  });
  if (!r) return;
  const d = S._modalDatos || {};
  await accion(null, async () => {
    await api('/admin/ganador-pago', { method: 'POST', body: { historialId: hid, userId: uid, pagado: r === 'pagar', txid: d.txid, nota: d.nota, notificar: !!d.notificar && r === 'pagar' } });
    toast(r === 'pagar' ? '✅ Pago registrado' : 'Marcado como pendiente'); await renderGanadores(); await cargarStats(true);
  });
}

/* ── AJUSTES ── */
function renderAjustes() {
  const c = S.stats.config;
  $('view').innerHTML = `
  <div class="card"><div class="card-h"><h2>📺 Anuncios y boletos</h2></div>
    <div class="grid2">
      <div class="fld"><label class="lbl" for="c-lim">Anuncios por usuario al día</label><input class="input" id="c-lim" type="number" min="1" max="50" value="${c.adLimitDiario}"><div class="hint">Cada anuncio = 1 boleto. Más anuncios = más ingresos, pero sorteos que se llenan más rápido.</div></div>
      <div class="fld"><label class="lbl" for="c-cool">Espera entre anuncios (segundos)</label><input class="input" id="c-cool" type="number" min="0" max="300" value="${c.cooldownSeg}"><div class="hint">Evita que alguien registre boletos sin ver el anuncio.</div></div>
    </div>
    <div class="fld" style="max-width:340px"><label class="lbl" for="c-cpm">CPM estimado (USD por 1000 anuncios)</label><div class="money-in"><span>$</span><input class="input" id="c-cpm" type="number" min="0" step="0.1" value="${c.cpmUsd}"></div><div class="hint">Solo se usa para las estimaciones del panel. Mira tu CPM real en Monetag.</div></div>
  </div>
  <div class="card"><div class="card-h"><h2>💬 Mensaje del bot</h2></div>
    <div class="fld"><label class="lbl" for="c-aviso">Aviso destacado en la bienvenida (opcional)</label><textarea class="input" id="c-aviso" maxlength="300" placeholder="Ej: ¡Este fin de semana sorteo extra!">${esc(c.avisoBienvenida)}</textarea><div class="hint">Aparece al final del mensaje de /start. Máx. 300 caracteres.</div></div>
    <button class="btn primary" onclick="guardarConfig(this)">💾 Guardar ajustes</button></div>
  <div class="card"><div class="card-h"><h2>🧩 Cómo funciona</h2></div>
    <ul style="padding-left:18px;color:var(--muted);display:grid;gap:7px">
      <li>El usuario ve un anuncio en la Mini App y recibe <b style="color:var(--text)">1 boleto</b>; el servidor valida que la petición venga de Telegram.</li>
      <li>Al llenarse la <b style="color:var(--text)">meta</b> (o llegar la fecha) el sorteo se realiza solo y los ganadores reciben un mensaje para registrar su <code>/wallet</code>.</li>
      <li>Cuando envíes el dinero, márcalo como pagado en <b style="color:var(--text)">Ganadores</b>: el ganador recibe el aviso con tu referencia.</li>
      <li>Si detectas trampa, <b style="color:var(--text)">suspende</b> al usuario: se borran sus boletos del sorteo activo.</li>
    </ul></div>`;
}
async function guardarConfig(btn) {
  await accion(btn, async () => {
    await api('/admin/config', { method: 'POST', body: { adLimitDiario: $('c-lim').value, cooldownSeg: $('c-cool').value, cpmUsd: $('c-cpm').value, avisoBienvenida: $('c-aviso').value } });
    toast('✅ Ajustes guardados'); await cargarStats(true); renderAjustes();
  });
}

/* ── arranque ── */
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (S.pass && VISTAS[h] && h !== S.view) ir(h); });
(async function init() {
  const guardada = ss.get('ls_admin');
  if (guardada) { $('pass').value = guardada; await login(); }
})();
</script>
</body>
</html>
